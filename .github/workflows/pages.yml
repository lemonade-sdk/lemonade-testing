name: Pages

# Rendering lives here rather than in lemonade, so a bug in the dashboard can never block a
# release. This job reads the files in this repository and nothing else: no `pi`, no model,
# no GitHub API.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install repo-manager
        run: pip install git+https://github.com/lemonade-sdk/repo-manager.git@v1.0.1

      - name: Render the dashboard
        run: repo-manager site render --state . --out site

      # Pages serves the artifact, not the branch, so the custom domain has to travel with it.
      - name: Keep the custom domain
        run: cp CNAME site/CNAME

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
